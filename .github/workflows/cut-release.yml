# Cut a module release: verify the release commit, and only then create its tag. MAS-274.
#
# A tag on this repository IS the release. The Terraform Registry publishes a version from its own
# webhook the moment a `v*` tag appears, entirely outside GitHub Actions, and a published version
# cannot be withdrawn — only superseded. So every check that runs on the tag build (ci.yml) runs
# too late to refuse anything. This workflow moves the checks to before the tag exists, which is
# the only place they can say no:
#
#   verify  the commit is named by its full SHA and is on main; the most recent `ci` run from its
#           push to main concluded success (which covers every ci.yml job, including `validate`,
#           the check main's branch ruleset requires); the tag does not exist yet, or already
#           exists at exactly this commit; the commit's MANIFEST.json entry for the version names
#           release/ images, each pinned by digest; and the commit's own manifest, changelog and
#           README publish exactly this version.
#   images  every image the module's stable and previous channels default to for the commit's
#           MANIFEST.json resolves in masterly.azurecr.io at the digest it records (or by tag, for
#           an entry with no digests). Every other check here is offline, which is how 0.22.0 and
#           0.23.0 were tagged naming builds the registry did not have. It reads with a pull-only
#           token from the `release` Environment, runs main's copy of the script only, and reads
#           the release commit's manifest as data. Unset, the token fails the job: never skipped.
#   tag     creates the annotated tag on that commit through the API, unless it is already there.
#           Nothing is pushed from a checkout, so no credential is ever written into a working
#           copy. Once the tag is seen at the commit, it sends the repository_dispatch
#           `release-published` (version, tag, commit) to masterly-data/masterly-release-tests.
#
# At Stable, masterly-release-tests's promote.yml dispatches this workflow with the commit and
# version from the signed Stable ring record (ADR 0107 §5). A run that created the tag and then
# failed is finished by dispatching the same version and commit again: the gate passes a tag
# already at the commit, the tag write is skipped, and release-published is sent. Re-running all
# jobs or only the failed ones works too: the tag job reads where the tag is itself before writing.
# A tag at any other commit is refused.
#
# What this workflow does NOT do by itself: stop a `v*` tag being pushed by hand. A tag pushed
# from a laptop still publishes, and ci.yml's tag build still only reports on it afterwards. Making
# this workflow the only way a tag can be created needs a tag ruleset on `v*` that only this
# workflow's identity may bypass, and that is a repository setting applied by a maintainer, not
# something a workflow file can grant itself. Until it is in place this is the documented path,
# not an enforced one. README.md, "Cutting a release", says which is true today.
#
# The identity that creates the tag:
#
#   * A GitHub App, when `vars.RELEASE_APP_CLIENT_ID` and `secrets.RELEASE_APP_PRIVATE_KEY` are set.
#     This is the identity a tag ruleset can name as its only bypass — GitHub does not accept the
#     built-in GitHub Actions app as a ruleset bypass actor on an organization's repository. A tag
#     an App creates also starts ci.yml's tag build on its own, which publishes the GitHub Release
#     page from the changelog.
#   * Otherwise the workflow's own GITHUB_TOKEN, with a warning. The gate above still runs in full.
#     GitHub starts no workflow for a tag its GITHUB_TOKEN creates, so this path then dispatches
#     ci.yml on the new tag explicitly — without that, the version would publish with no tag build
#     and no Release page. Once the tag ruleset is applied this path is refused by GitHub, which is
#     the intended failure: configure the App.
#
# Dispatch it from main only — the gate that runs is the one on the branch it is dispatched from,
# and main is where a change to it has been reviewed. The `release` Environment of the `images` and
# `tag` jobs is where a maintainer restricts that to main mechanically and, if wanted, adds a
# required reviewer.
#
# Every input reaches a shell through `env:`, never spliced into a `run:` script.

name: cut-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z — MANIFEST.json and CHANGELOG.md at the commit must already publish it"
        required: true
        type: string
      commit:
        description: "Full 40-character SHA of the release commit on main"
        required: true
        type: string
      summary:
        description: "Optional one-line summary for the tag message (vX.Y.Z — summary)"
        required: false
        type: string
        default: ""

# Least privilege: nothing at workflow level; each job asks for what it uses.
permissions: {}

# One release at a time, and never a cancelled one: a second dispatch waits, and then finds the
# first one's tag already exists — at its commit, which only re-sends release-published, or at
# another, which is refused.
concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  verify:
    name: The commit may be released
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout, and the commit's history
      actions: read # the ci.yml runs for the commit
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      existing: ${{ steps.gate.outputs.existing }} # 'true' when the tag is already at the commit
    steps:
      - name: Dispatched from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::dispatch this workflow from main, not $GITHUB_REF — the release gate that runs is the one on the branch it is dispatched from"
            exit 1
          fi

      # persist-credentials: false — nothing in this job talks to the remote with a credential.
      # fetch-depth: 0 so the release commit and main's history are both in the clone for the
      # ancestry check below. See masterly-framework docs/conventions/github-repo-settings.md,
      # "Checkout credentials".
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The gate still refuses what it should
        run: python3 scripts/release_gate.py --selftest

      # First, before the commit is handed to git at all: it is a full lowercase SHA (the gate's
      # COMMIT_RE, repeated here because `git show` below reads the manifest before the gate runs),
      # and it is on main. The input is not echoed until it has matched, so a malformed one cannot
      # write a workflow command into the log.
      - name: The commit is on main
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the commit input is not a full 40-character lowercase commit SHA — a branch name, a short SHA or HEAD is how a tag lands on a commit nobody meant"
            exit 1
          fi
          if ! git cat-file -e "$COMMIT^{commit}" 2>/dev/null; then
            echo "::error::$COMMIT is not a commit in this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" "$GITHUB_SHA"; then
            echo "::error::$COMMIT is not on main (main is at $GITHUB_SHA) — only a commit that merged is released"
            exit 1
          fi

      # The gate, main's copy: version and commit well-formed, the tag new or already at exactly
      # this commit, the commit's manifest entry naming release images pinned by digest, and CI
      # green on the commit's push to main. The manifest is read as data with `git show`, so the
      # rule binds a commit cut before it existed and none of the commit's code runs.
      # `--existing-out` says whether the tag is already there (a re-run after a later step
      # failed), for the run's own record. The tag job does not act on it: a re-run of only the
      # failed jobs replays this output from the earlier attempt, so that job reads the tag itself.
      - name: CI passed on the commit's push to main, and the tag is new or already at the commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" \
            -f head_sha="$COMMIT" -f event=push -f branch=main -f per_page=100 \
            > "$RUNNER_TEMP/runs.json"
          git show "$COMMIT:MANIFEST.json" > "$RUNNER_TEMP/release-manifest.json"
          # Public repository, so listing its tags needs no credential. Without --refs, so an
          # annotated tag's peeled `^{}` line gives the commit it points at, not the tag object.
          git ls-remote --tags origin 'v*' > "$RUNNER_TEMP/tag-refs.txt"
          # Bare names for check_release_manifest.py --published-tags below.
          sed -n 's#.*refs/tags/##p' "$RUNNER_TEMP/tag-refs.txt" | grep -v '\^{}$' \
            > "$RUNNER_TEMP/tags.txt" || true
          tag="$(python3 scripts/release_gate.py --version "$VERSION" --commit "$COMMIT" \
            --runs "$RUNNER_TEMP/runs.json" --tags "$RUNNER_TEMP/tag-refs.txt" \
            --manifest "$RUNNER_TEMP/release-manifest.json" \
            --existing-out "$RUNNER_TEMP/existing.txt")"
          existing="$(cat "$RUNNER_TEMP/existing.txt")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "existing=$existing" >> "$GITHUB_OUTPUT"

      # The same checks ci.yml runs on the tag build, run here against the release commit's own
      # tree and its own copies of the scripts — so the tag build that follows asks nothing this
      # step did not already answer.
      - name: The commit's manifest, changelog and README publish this version
        env:
          COMMIT: ${{ inputs.commit }}
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/release" "$COMMIT"
          cd "$RUNNER_TEMP/release"
          python3 scripts/check_release_manifest.py
          # --published-tags: every other version this commit's manifest lists already has its
          # tag, so the file at the new tag names only published versions. The release commit
          # merges before its tag, so main can carry a cut that was never tagged.
          python3 scripts/check_release_manifest.py --tag "$TAG" \
            --published-tags "$RUNNER_TEMP/tags.txt"
          python3 scripts/release_notes.py "$TAG" > /dev/null

  # The one job that holds the registry credential, so it runs nothing from the release commit's
  # tree: main's checkout and main's script only, with the commit's MANIFEST.json read as data.
  images:
    name: The release's default images resolve in the registry
    needs: verify
    runs-on: ubuntu-latest
    # The credential lives on this Environment only, never as a repository or organization secret.
    # Restricting the Environment to main is what keeps it there; the first step is a second line.
    environment: release
    permissions:
      contents: read # checkout main, and read the release commit's MANIFEST.json
    steps:
      - name: Dispatched from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::dispatch this workflow from main, not $GITHUB_REF — the registry credential is read only by a run dispatched from main"
            exit 1
          fi

      # persist-credentials: false — the registry credential is never written into a working copy,
      # and nothing here talks to the remote. fetch-depth: 0 so the release commit is in the clone.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The image check still refuses a missing image or a moved tag
        run: python3 scripts/check_release_images.py --selftest

      # `verify` has already refused anything that is not a full SHA on main. `git show` reads the
      # file as data into $RUNNER_TEMP: no worktree of the release commit, so none of its code runs.
      - name: The release commit's MANIFEST.json, read as data
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git show "$COMMIT":MANIFEST.json > "$RUNNER_TEMP/release-manifest.json"

      # The password reaches main's script through its environment only — never argv, never a file.
      # The script fails naming the variable or the secret when either is unset, masks the access
      # token it exchanges the password for, and treats a 401 or 403 as a refused credential.
      - name: Every default stable and previous image resolves in masterly.azurecr.io
        env:
          RELEASE_ACR_TOKEN_NAME: ${{ vars.RELEASE_ACR_TOKEN_NAME }}
          RELEASE_ACR_TOKEN_PASSWORD: ${{ secrets.RELEASE_ACR_TOKEN_PASSWORD }}
        run: python3 scripts/check_release_images.py --manifest "$RUNNER_TEMP/release-manifest.json"

  # The one job that mints write tokens: the tag token for this repository and the dispatch token
  # for masterly-release-tests. It checks nothing out, so no code from the release commit's tree —
  # or from anywhere else — runs while either token is in scope.
  tag:
    name: Create the tag and announce the release
    needs: [verify, images]
    runs-on: ubuntu-latest
    # A maintainer restricts this Environment to main and may add a required reviewer; until then
    # GitHub creates it on first use with no protection rules. It is also where the App's private
    # key belongs, so a workflow edited on another branch cannot reach it.
    environment: release
    permissions:
      contents: write # create the tag, on the GITHUB_TOKEN path only
      actions: write # dispatch ci.yml on the new tag, on the GITHUB_TOKEN path only
    steps:
      - name: Dispatched from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::dispatch this workflow from main, not $GITHUB_REF — the release tokens are minted only by a run dispatched from main"
            exit 1
          fi

      # Where the tag is now, read by this job rather than taken from verify's `existing` output.
      # "Re-run failed jobs" runs this job again but reuses verify's outputs from the earlier
      # attempt, which can say "absent" about a tag that attempt went on to create. Trusting
      # that output made such a re-run try to create the tag again and fail with "Reference
      # already exists" (0.25.0, 2026-11-20). A tag at another commit is still refused here,
      # as verify refuses it.
      - name: Where the tag is now
        id: now
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          # The peeled `^{}` line is the commit an annotated tag points at; a lightweight tag has
          # only its own line. The pattern ends in `*` so the `^{}` line matches it too; awk keeps
          # only this tag's two refs.
          at="$(git ls-remote --tags "https://github.com/$REPO.git" "$TAG*" |
            awk -v ref="refs/tags/$TAG" '$2 == ref "^{}" { peeled = $1 } $2 == ref { named = $1 }
              END { print (peeled != "" ? peeled : named) }')"
          if [ -z "$at" ]; then
            echo "existing=false" >> "$GITHUB_OUTPUT"
          elif [ "$at" = "$COMMIT" ]; then
            echo "$TAG is already at $COMMIT, so it is not written again; release-published is still sent"
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$TAG is at $at, not at $COMMIT — a published tag is never moved"
            exit 1
          fi

      # When the tag is already at the commit, no tag token is minted and nothing is written:
      # the run goes straight to confirming the tag and sending release-published.
      - name: Mint the release App's token
        id: app
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' && steps.now.outputs.existing == 'false' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # This repository only, and only what creating a tag needs.
          permission-contents: write

      # Only when the tag is absent now. A tag at another commit never gets here: verify or the
      # step above refused it, naming both commits.
      - name: Create the annotated tag on the release commit
        id: create
        if: ${{ steps.now.outputs.existing == 'false' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          VIA_APP: ${{ steps.app.outputs.token != '' }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ inputs.commit }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          if [ "$VIA_APP" != "true" ]; then
            echo "::warning::no release App is configured (vars.RELEASE_APP_CLIENT_ID), so the tag is created with this workflow's GITHUB_TOKEN. The checks above still gated it, but a v* tag ruleset cannot name this identity as its bypass — see README.md, 'Cutting a release'."
          fi
          message="$TAG"
          if [ -n "$SUMMARY" ]; then message="$TAG — $SUMMARY"; fi
          object="$(gh api "repos/$REPO/git/tags" -f tag="$TAG" -f message="$message" \
            -f object="$COMMIT" -f type=commit --jq .sha)"
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" > /dev/null
          {
            echo "### $TAG created on \`$COMMIT\`"
            echo
            echo "The Terraform Registry publishes it from its own webhook. Confirm it appears at"
            echo "https://registry.terraform.io/modules/masterly-data/masterly/azurerm/${TAG#v}"
            echo "and that ci.yml's tag build publishes its GitHub Release page."
          } >> "$GITHUB_STEP_SUMMARY"

      # A tag created with GITHUB_TOKEN starts no workflow, so the tag build — the post-publish
      # check and the GitHub Release page — is started explicitly. A tag an App created has
      # already started it, and dispatching again would only run it twice.
      - name: Start the tag build (GITHUB_TOKEN path only)
        if: ${{ steps.create.outcome == 'success' && steps.app.outputs.token == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh workflow run ci.yml --ref "$TAG"

      # Whether this run created the tag or found it, release-published goes out only once the tag
      # is seen at exactly the commit. Every step above must have succeeded to get here.
      - name: The tag is at the release commit
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          # The peeled `^{}` line is the commit an annotated tag points at; a lightweight tag has
          # only its own line. The pattern ends in `*` so the `^{}` line matches it too; awk keeps
          # only this tag's two refs.
          at="$(git ls-remote --tags "https://github.com/$REPO.git" "$TAG*" |
            awk -v ref="refs/tags/$TAG" '$2 == ref "^{}" { peeled = $1 } $2 == ref { named = $1 }
              END { print (peeled != "" ? peeled : named) }')"
          if [ "$at" != "$COMMIT" ]; then
            echo "::error::$TAG is at '${at:-nothing}', not at $COMMIT — release-published is not sent"
            exit 1
          fi

      # A second token from the same App (or the App named by the RELEASE_DISPATCH_APP_* settings),
      # scoped to masterly-release-tests only, with only what a repository_dispatch needs. No `if:`:
      # with no App configured this fails, and re-dispatching once it is configured is safe.
      - name: Mint the dispatch token for masterly-release-tests
        id: dispatch-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_DISPATCH_APP_CLIENT_ID || vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_DISPATCH_APP_PRIVATE_KEY || secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: masterly-data
          repositories: masterly-release-tests
          permission-contents: write

      # The payload is exactly version (X.Y.Z), tag (vX.Y.Z) and commit (the full SHA), which
      # masterly-release-tests's registry-boundary.yml matches on. `-f` keeps each a string.
      - name: Send release-published to masterly-release-tests
        env:
          GH_TOKEN: ${{ steps.dispatch-app.outputs.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          gh api repos/masterly-data/masterly-release-tests/dispatches \
            -f event_type=release-published \
            -f "client_payload[version]=${TAG#v}" \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[commit]=$COMMIT" > /dev/null
          {
            echo "### release-published sent to masterly-release-tests"
            echo
            echo "version \`${TAG#v}\`, tag \`$TAG\`, commit \`$COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"
