# CI for the public module: formatting, validation, and mock-provider tests. No cloud
# access and no secrets — `terraform test` runs entirely against mock providers, so this
# is safe to run on pull requests from forks, which is the point of a public repo.
#
# This repo carries no deployment. Everything Masterly deploys with the module lives
# elsewhere; what is gated here is the artifact customers consume at a version tag.

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# A re-push supersedes the run before it, so cancel the superseded PR run rather than pay
# for a result nobody will read. Guarded to pull_request: a push to main — a deploy on some
# repos, a tag build on others — must never be cancelled by whatever lands next. MAS-174.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — actions/checkout otherwise leaves the job's
      # GITHUB_TOKEN in .git/config for the rest of the run, where any later step or
      # third-party action can read it. Nothing in this repo pushes from CI, so the
      # token has no job to do after the checkout. See masterly-framework
      # docs/conventions/github-repo-settings.md, "Checkout credentials".
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4, pinned by digest
        with:
          # At or above the module's required_version (>= 1.10) — cross-resource
          # preconditions and the test framework both depend on it.
          terraform_version: 1.10.5

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate the module (root)
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # The example is what a customer copies, so a broken one is a customer-facing
      # defect. It reads the licence JWK from a file the bundle supplies, which a bare
      # checkout does not have — so CI writes a throwaway public key to validate the
      # example's STRUCTURE. Deliberately not committed: a fake key sitting in a public
      # repo next to a real one is a worse trap than the one this closes.
      - name: Validate the production example
        run: |
          printf '{"kty":"EC","crv":"P-256","x":"AAAA","y":"AAAA","kid":"ci-placeholder"}' \
            > examples/production/license-issuer.jwk.json
          terraform -chdir=examples/production init -backend=false -input=false
          terraform -chdir=examples/production validate
          rm -f examples/production/license-issuer.jwk.json

      - name: Test the module (mock providers — guards, residency, conditional branches)
        run: terraform test

  # The module ships three shell scripts — the operator's diagnostic bundle, the pre-apply
  # preflight, and the bundle's own test harness — and until this job existed nothing read them
  # but a person. The defect that argues for it was caught exactly that way: a `[[ … ]] &&
  # assignment` as the last command of a function, which under `set -e` ends the script when the
  # test is false. Nothing in the suite below would have failed; the script would simply have
  # stopped early and written a partial bundle, on the channel a self-hosted install reaches
  # support through, during the incident it exists to shorten. MAS-428.
  #
  # It fails on ANY shellcheck finding, which is shellcheck's default severity. The obvious
  # laxer threshold — failing only on `warning` and `error` — would let SC2086 through, and an
  # unquoted expansion that word-splits a path is the most ordinary way a script does something
  # other than what it reads. So the two defensible lines are "info and above" and "everything",
  # and this tree is already clean at "everything" apart from six deliberate idioms, each
  # suppressed where it occurs with its reason beside it. `git ls-files '*.sh' | xargs grep -n
  # 'shellcheck disable'` is the complete list, and it is meant to stay short: a finding is
  # answered by fixing it or by a directive that says why, never by moving this line.
  #
  # shellcheck is already on the GitHub-hosted runner image, so this job installs nothing and
  # reaches no network — the property that lets every other job here run on a fork's pull
  # request. Its version is printed, because a finding is easiest to reproduce against the
  # version that reported it.
  #
  # The files come from `git ls-files` rather than from a pair of directory globs: the day shell
  # lands somewhere nobody listed, a glob lints nothing there and passes.
  shell-lint:
    name: The module's shell passes shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint every shell script in the tree
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=style

  # The diagnostic bundle (scripts/diagnostic-bundle.sh) is the primary support channel for a
  # self-hosted install, and it makes two promises of different strengths. It carries no
  # secret values, credentials, addresses or key material — asserted as absence, canary by
  # canary. And it carries no record data from the applications' own log lines, but CAN carry
  # it in logs/q6-postgres-logs.json, the starter server's own Postgres log stream, which
  # echoes a failing statement and the values on its DETAIL: line — so for that class the
  # promise is that the file is FLAGGED, and that is what is asserted. Both are tests, not
  # comments: the harness runs the real script against a fake `az` whose answers are seeded
  # with both classes of value. A third scenario stages the script into purpose-built module
  # trees and asserts that the version in manifest.json's `.tool` is the one the tree it ran
  # from actually is — never the newest published release, which on a clone of `main` is a tag
  # that does not contain the script. The selftest runs FIRST, and breaks the script five ways to
  # insist the harness notices — a detector nobody has watched fail is a hypothesis, and this
  # repo's characteristic defect is a rule with nothing enforcing it.
  # No cloud, no credential: safe on a pull request from a fork. MAS-343.
  diagnostic-bundle:
    name: The diagnostic bundle carries no secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: The detector still detects (a broken script must fail the suite)
        run: bash tests/diagnostic_bundle_test.sh --selftest

      - name: No secrets or credentials, and record data flagged where it is not guaranteed absent
        run: bash tests/diagnostic_bundle_test.sh

  # A release states its version and its tested image pair once, in MANIFEST.json, and what
  # changed once, in CHANGELOG.md. This job is what makes that unforgettable rather than
  # well-intentioned: on a pull request it fails when the manifest, the changelog and the README
  # stop agreeing, so the commit that bumps them is validated before it merges; on a tag push it
  # additionally fails when the tag is not the version the manifest publishes, so a tag cut
  # without its entries goes red at once instead of surfacing a release later. MAS-239.
  #
  # It also refuses a module version hand-typed into the header of a script the module ships.
  # `scripts/preflight.sh` announced itself as v0.7.0 for eight releases — correct the day it was
  # written, and read by a customer at the moment they are checking which artifact they hold. A
  # file copied unchanged into every release cannot state its own version, so the header states
  # none. MAS-479.
  #
  # The selftest runs FIRST, for the reason the diagnostic-bundle job runs its own first: a
  # checker nobody has watched reject anything is a hypothesis, and this repo's characteristic
  # defect is a rule with nothing enforcing it. It stages synthetic module trees where the
  # manifest is missing, malformed or disagrees with the tag, and fails unless each is still
  # rejected by name — so a check that has quietly stopped checking goes red instead of passing
  # every release for the wrong reason. MAS-441.
  release-metadata:
    name: Manifest, changelog, README and script headers agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The check still rejects a missing, malformed or mis-tagged release
        run: python3 scripts/check_release_manifest.py --selftest

      # The release job below publishes what this script extracts, so it is proven on every pull
      # request rather than first exercised on the tag build that needs it.
      - name: The release-notes extraction still refuses a missing, empty or unreleased section
        run: python3 scripts/release_notes.py --selftest

      # Standard library only — release metadata should not depend on anything resolving, and
      # this repo ships no Python dependencies to resolve.
      - name: Check the release manifest, changelog, README and script headers
        run: python3 scripts/check_release_manifest.py

      # github.ref_name is the tag itself on a tag push. Split out so the failure message says
      # which of the two questions was being asked.
      - name: The tag is the version the manifest publishes
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/check_release_manifest.py --tag "${{ github.ref_name }}"

  # The GitHub Release page for a tag, with that version's CHANGELOG.md section as its body. The
  # module version is the one customer-facing version (ADR 0062), and this page is where a reader
  # looks for what it changed. MAS-258.
  #
  # What this job is NOT: a gate on the release. The Terraform Registry publishes a version from
  # its own webhook the moment the tag is pushed, before any job here has started, and nothing in
  # this workflow can withdraw it. `needs:` means a tag whose checks fail gets no Release page — a
  # visible sign that the version was published without passing — and nothing more.
  #
  # The body comes from CHANGELOG.md as it is at the tagged commit, never from text typed here, and
  # scripts/release_notes.py fails the job when that section is missing or empty rather than
  # publishing a placeholder.
  #
  # Re-running is safe. When a Release for the tag already exists its title, body and latest flag
  # are rewritten from the tagged changelog — which cannot have changed, since the tag has not — so
  # a re-run converges instead of failing on "already exists" or creating a second page. The one
  # thing it overwrites is a hand edit to that page's notes; correct the changelog instead.
  #
  # "Latest" is decided from the tags, not left to GitHub's default, which weighs when a release
  # was created as well as its version: a patch tagged for an older line after a newer version
  # exists is published, but not marked latest.
  release:
    name: Publish the GitHub Release from the changelog
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, shell-lint, diagnostic-bundle, release-metadata]
    runs-on: ubuntu-latest
    # The only job in this repository that writes: it creates or edits the Release object. It
    # pushes no commit and no tag.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract this version's changelog section
        env:
          TAG: ${{ github.ref_name }}
          LINK_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/
        run: python3 scripts/release_notes.py "$TAG" --link-base "$LINK_BASE" > "$RUNNER_TEMP/release-notes.md"

      # Public repository, so listing its tags needs no credential.
      - name: Decide whether this version is the newest release
        id: newest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' > "$RUNNER_TEMP/tags.txt"
          echo "latest=$(python3 scripts/release_notes.py "$TAG" --is-newest < "$RUNNER_TEMP/tags.txt")" >> "$GITHUB_OUTPUT"

      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          LATEST: ${{ steps.newest.outputs.latest }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest="$LATEST"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest="$LATEST"
          fi
