# Dependabot keeps the pinned action digests and the dependency manifests current.
# Third-party actions in .github/workflows are pinned by commit SHA (a tag can be
# moved; a SHA cannot), which makes them invisible to a human reading for staleness —
# so the github-actions ecosystem below is what actually keeps them from rotting.
#
# Grouping (MAS-126): a wall of PRs each week gets skimmed, and a skimmed wall is how
# a real one goes through unread. Actions group at every level, because actions/* ride
# major tags deliberately and third-party ones are pinned by SHA, so the diff is a
# digest either way and the version that changed is in the title. Code dependencies
# group minor and patch only, so a major always arrives as its own readable PR.
version: 2
updates:
  - package-ecosystem: "terraform"
    directories:
      - "/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # The module customers consume at a semver tag: a provider major is a release
    # decision needing a live plan before a tag, not a weekly proposal (MAS-126).
    #
    # The update-types rule alone did not hold: on 2026-09-21 Dependabot opened #46,
    # widening versions.tf from ~> 4.61 to ~> 5.6. This repo commits no lock file, so
    # Dependabot has no resolved version to classify a change as "major" against, and a
    # rule keyed on the classification never matched. The versions rule names the range
    # itself and does not depend on that classification. Lift both together when azurerm 5
    # is decided (MAS-129): the constraint lives in versions.tf and in each
    # modules/*/versions.tf, and a bump that moves only one of them cannot resolve.
    ignore:
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hashicorp/azurerm"
        versions: [">= 5.0.0"]
    groups:
      terraform-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
